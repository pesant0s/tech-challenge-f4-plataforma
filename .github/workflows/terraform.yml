name: Terraform

# Plan e apply só na main e com AMBIENTE_ATIVO=true (ADR-007 e ADR-013): nenhum pipeline
# recria o cluster do zero, ligar a cobrança é sempre `make up`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-f4-plataforma
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  TF_VAR_org_github: ${{ github.repository_owner }}
  TF_VAR_id_dono_github: ${{ github.repository_owner_id }}

permissions:
  contents: read

jobs:
  validar:
    name: Formatação e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  ambiente-desligado:
    name: Plan e apply não executados
    needs: validar
    if: github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### Plan e apply pulados — AMBIENTE_ATIVO não está true, o cluster está desligado." >> "$GITHUB_STEP_SUMMARY"

  aplicar:
    name: Plan e apply
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
      TF_VAR_email_alertas: ${{ vars.EMAIL_ALERTAS }}
      # Com AWS_ROLE_ARN vale o OIDC; sem ele, as credenciais da sessão do laboratório.
      TEM_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar na AWS via OIDC
        id: oidc
        if: env.TEM_ROLE == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar na AWS com as credenciais da sessão
        if: env.TEM_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Explicar falha de autenticação
        if: steps.oidc.outcome == 'failure'
        run: |
          echo "::error::AMBIENTE_ATIVO=true, mas a role não pôde ser assumida: o ambiente foi destruído sem 'make down' ou o secret AWS_ROLE_ARN está desatualizado."
          exit 1

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=tech-challenge-f4-tfstate-$(aws sts get-caller-identity --query Account --output text)" \
            -backend-config="region=$AWS_REGION"

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
